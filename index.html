<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>CyberStart</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div id="boot-screen">
      <div class="boot-logo">CyberOs</div>

      <div class="boot-text" id="boot-text">INITIALIZING...</div>
    </div>

    <div class="nofications" id="nofications">
      <div class="nofications-container">
        <img src="assets/images/l.png" alt="Image" />
        <p id="textNofication">Какой то текст ошибки !!</p>
        <button type="button" class="control-btn okey-btn">Окей</button>
      </div>
    </div>

    <main>
      <div class="my-links">
        <div class="folders-container">
          <!-- Папка 3: -->
        </div>

        <!-- Управление папками -->
        <div class="folder-controls">
          <button id="addFolderBtn" class="control-btn">+ Новая папка</button>
          <button id="addLinkBtn" class="control-btn">+ Добавить ссылку</button>
          <button id="deleteFolderBtn" class="control-btn delete-btn">
            🗑️ Удалить
          </button>
        </div>
      </div>

      <div class="dashboard hidden">
        <section class="hero">
          <h1 id="clock"></h1>

          <p class="subtitle">Wake up, Mustafo.</p>
        </section>

        <div class="search-container">
          <section class="search-box">
            <div class="search-box-items">
              <input id="search" placeholder="Search..." />
              <select id="searchEngine" class="search-engine">
                <option name="google" id="google" value="google">Google</option>
                <option name="duckduck" id="duck" value="duckduck">
                  DuckDuck
                </option>
                <option name="yandex" id="yandex" value="yandex">yandex</option>
              </select>
            </div>
          </section>

          <section class="search-box">
            <div class="search-box-items">
              <img
                src="./assets/icons/image.png"
                alt="youtube icon"
                class="youtube-icon"
              />
              <input id="searchVid" placeholder="YouTube" />
            </div>
          </section>

              />

            <input
              id="searchImg"
              placeholder="Search images"
              class="yandex-input"
            />
          </section>
        </div>

        <div class="box-buttom">
          <button class="button-change-wallpaper" id="btnChangeWallpaper">
            Обои
          </button>
          <button class="button-change-wallpaper">Обои</button>
          <button class="button-change-wallpaper">Обои</button>
          <button class="button-change-wallpaper">Обои</button>
          <button class="button-change-wallpaper">Обои</button>
        </div>
      </div>

      <div class="music-player hidden">
        <div class="container animate-fade-in-right delay-1">
          <div class="player-info">
            <span class="music-icon">♫</span>

            <div>
              <div class="song-name">My Favorite Song</div>
              <div class="song-status" id="songStatus">Paused</div>
            </div>
          </div>

          <div class="player-controls">
            <button id="playBtn" class="play-btn">▶</button>

            <input type="range" id="progress" min="0" max="100" value="0" />
          </div>

          <audio id="music" preload="auto">
            <source
              src="assets/sounds/sakura-serenade_89861.mp3"
              type="audio/mpeg"
            />
          </audio>
        </div>
      </div>
    </main>

    <!-- Модальное окно для новой папки -->
    <div id="folderModal" class="modal">
      <div class="modal-content">
        <div class="modal-title">Создать новую папку</div>
        <input
          type="text"
          id="folderNameInput"
          class="modal-input"
          placeholder="Название папки..."
        />
        <div class="modal-buttons">
          <button id="folderConfirmBtn" class="modal-btn modal-btn-confirm">
            Создать
          </button>
          <button id="folderCancelBtn" class="modal-btn modal-btn-cancel">
            Отмена
          </button>
        </div>
      </div>
    </div>

    <!-- Модальное окно для новой ссылки -->
    <div id="linkModal" class="modal">
      <div class="modal-content">
        <div class="modal-title">Добавить новую ссылку</div>
        <input
          type="text"
          id="linkNameInput"
          class="modal-input"
          placeholder="Название ссылки..."
        />
        <input
          type="text"
          id="linkUrlInput"
          class="modal-input"
          placeholder="URL..."
        />
        <div class="modal-buttons">
          <button id="linkConfirmBtn" class="modal-btn modal-btn-confirm">
            Добавить
          </button>
          <button id="linkCancelBtn" class="modal-btn modal-btn-cancel">
            Отмена
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="js/animations.js"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
